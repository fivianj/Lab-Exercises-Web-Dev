<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Exercise 02 - Form</title>
  </head>
  <body>
    <main>
      <h1>Roth IRA Calculator</h1>

      <form>
        <p>
          <label for="balance">Balance ($)</label>
          <br>
          <input id="balance" name="balance">
          <br>
        </p>
        
        <p>
          <label for="annualContr">Annual contribution (4)</label>
          <br>
          <input id="annualContr" name="annualContr">
        </p>

        <p>
          <label for="maxContr">Maximize contributions?</label>
          <br>
          <input id="maxContr" type="radio" name="maxContr">Yes</input>
          <input id="maxContr" type="radio" name="maxContr">No</input>
        </p>

        <p>
          <label for="returnRate">Expected Rate of Return (5)</label>
          <br>
          <input id="returnRate" name="returnRate" type="number">
          <br>
        </p>
        
        <p>
          <label for="ageCurr">Current Age</label>
          <br>
          <input id="ageCurr" name="ageCurr" type="number">
          <br>
        </p>

        <p>
          <label for="ageRetire">Retirement Age</label>
          <br>
          <input id="ageRetire" name="ageRetire" type="number">
          <br>
        </p>

        <p>
          <label for="taxRate">Marginal tax rate (%)</label>
          <br>
          <input id="taxRate" name="taxRate" type="number">
          <br>
        </p>

        <button type="submit">Calculate</button>
        <button type="reset">Reset</button>
      </form>

      <p>
        This exercise is a simplified version of the Roth IRA Calculator at
        <a href="https://www.calculator.net/roth-ira-calculator.html">Calculator.net</a>.
      </p>
    </main>
  </body>
</html>
