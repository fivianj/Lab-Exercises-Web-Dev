<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 01 - Audit</title>
  </head>
  <body>
    <form>
      <label for='name'>Name:</label>
      <br />
      <input type="text" name="name" id="name" />
      <br /><br />
      
      <label for="address">Address:</label>
      <br />
      <input type="text" name="address" id="address" />
      <br /><br />

      <label for="city">City</label><br />
      <input type="text" name="city" id="city" />
      <br /><br />

      <label for="zip">Zip:</label>
      <br />
      <input type="text" name="zip" id="zip" />
      <br /><br />
      
      <fieldset>
        <label for="card">
          <legend>Credit card Type:</legend>
        </label>
        <br />
        <input type="radio" name="card" value="visa" id="card"/> Visa<br />
        <input type="radio" name="card" value="mastercard" id="card"/> MasterCard<br />
        <input type="radio" name="card" value="amex" id="card"/> American Express<br /><br />
      </fieldset>
      <label for="cardNumber">Credit Card Number:</label>
      <br />
      <input type="text" name="cc_number" id="cardNumber" /><br /><br />
      
      <label for="cvc">CVC:</label>
      <br />
      <input type="text" name="cvv" id="cvc"/><br /><br />

      <input type="button" value="Submit" />
    </form>
  </body>
</html>
